<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlante delle Meridiane – Meridiane d'Italia</title>
  <meta name="description" content="Atlante fotografico delle meridiane: scopri le meridiane catalogate nei comuni italiani, con fotografie, località, motti e informazioni.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://sebb71.github.io/meridiane/">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="eyebrow">COLLEZIONE PERSONALE</p>
        <h1>Atlante delle Meridiane</h1>
        <p class="subtitle">Fotografie e informazioni sulle meridiane incontrate lungo il cammino.</p>
      </div>
      <div class="counter"><strong id="count">0</strong><span>meridiane</span></div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Ricerca">
<select id="comune">
        <option value="">Tutti i comuni</option>
      </select>
</section>

    <section class="layout">
      <div class="map-area">
        <div id="map" aria-label="Mappa delle meridiane"></div>
      </div>
      <aside id="side-panel" class="side-panel">
  <div id="catalog-panel" class="catalog-panel">
    <div class="catalog-header">
      <label for="comune"><span class="eyebrow">COMUNE</span></label>
      
    </div>
    <div id="details" class="details">
      <div class="empty">
        <div class="sun">☀</div>
        <p>Seleziona un comune dall'elenco oppure clicca un sole sulla mappa.</p>
      </div>
    </div>
    <div id="municipality-list" class="municipality-list"></div>
  </div>
</aside>
    </section>


  </main>

  <footer>
    <p>Atlante delle Meridiane · Dati e fotografie della collezione personale</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
